<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Happy Birthday Alfi Masykuroh</title>
<style>
:root{--bg:#07030a;--gold:#ff5fa2;--gold-hi:#ffd6e8;--gold-lo:#8a2a55;--cream:#ffeaf3;box-sizing:border-box;color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--bg:#07030a}}
:root[data-theme="dark"]{--bg:#07030a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{will-change:transform}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(7,3,10,0) 35%,rgba(7,3,10,.85) 100%)}
#frame{position:fixed;inset:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;border:1px solid rgba(255,95,162,.75);box-shadow:inset 0 0 0 6px rgba(7,3,10,.9),inset 0 0 0 7px rgba(255,95,162,.35),0 0 30px rgba(255,95,162,.2)}
#again,#start,#mute{font-family:Georgia,"Times New Roman",serif;color:var(--cream);cursor:pointer}
#again{position:fixed;left:50%;bottom:calc(38px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:15px;letter-spacing:.12em;background:rgba(7,3,10,.7);border:1px solid var(--gold);border-radius:2px;padding:11px 26px;opacity:0;pointer-events:none;transition:opacity .8s}
#again.show{opacity:1;pointer-events:auto}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:.14em;background:linear-gradient(180deg,rgba(60,12,36,.85),rgba(14,4,9,.9));border:1px solid var(--gold);border-radius:2px;padding:20px 46px;box-shadow:0 0 0 5px rgba(7,3,10,.9),0 0 0 6px rgba(255,95,162,.4),0 0 60px rgba(255,95,162,.35)}
#start small{display:block;font-size:13px;letter-spacing:.08em;color:var(--gold);margin-top:8px;font-style:italic}
#mute{position:fixed;right:30px;top:calc(30px + env(safe-area-inset-top,0px));font-size:16px;line-height:1;background:rgba(7,3,10,.6);border:1px solid var(--gold);border-radius:50%;width:38px;height:38px;display:none}
#from{position:fixed;left:50%;top:calc(50% + 84px);transform:translateX(-50%);font:italic 18px Georgia,"Times New Roman",serif;letter-spacing:.12em;color:var(--gold);white-space:nowrap;text-align:center;text-shadow:0 0 18px rgba(255,95,162,.5)}
#from::before{content:"";display:block;width:56px;height:1px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#emo{position:fixed;left:50%;top:50%;height:min(34vh,56vw);transform:translate(-50%,-50%) scale(.3);opacity:0;transition:opacity .5s,transform .8s cubic-bezier(.2,1.6,.4,1);pointer-events:none;border:2px solid #ff5fa2;border-radius:14px;box-shadow:0 0 0 5px rgba(7,3,10,.9),0 0 0 6px rgba(255,95,162,.45),0 0 40px rgba(255,95,162,.5)}
#emo.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#again:focus-visible,#start:focus-visible,#mute:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>

  function initAudio(){
    if(ac)return;var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    ac=new A();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);
    if(ac.resume)ac.resume();
  }
  function tone(f,t,d,type,v){
    var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  }
  function song(){
    if(!ac)return;var t=ac.currentTime+.05;
    [1,.7].forEach(function(vol,pass){
      TUNE.forEach(function(n,i){
        var end=pass===1&&i===TUNE.length-1,d=end?2.4:Math.max(.5,n[1]*BEAT*1.5);
        tone(n[0],t,d,'triangle',.26*vol);tone(n[0]*2,t,d*.7,'sine',.1*vol);tone(n[0]*3,t,d*.3,'sine',.035*vol);
        if(end)tone(n[0]/2,t,d,'sine',.14);
        t+=n[1]*BEAT;
      });
    });
  }
