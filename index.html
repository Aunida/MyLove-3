<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Alfi Masykuroh</title>
<style>
:root{--bg:#050403;--gold:#d4af37;--gold-hi:#fff1b8;--gold-lo:#8a6a14;--cream:#fff4d6;box-sizing:border-box;color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--bg:#050403}}
:root[data-theme="dark"]{--bg:#050403}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{will-change:transform}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(5,4,3,0) 35%,rgba(5,4,3,.85) 100%)}
#frame{position:fixed;inset:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;border:1px solid rgba(212,175,55,.75);box-shadow:inset 0 0 0 6px rgba(5,4,3,.9),inset 0 0 0 7px rgba(212,175,55,.35),0 0 30px rgba(212,175,55,.15)}
#again,#start,#mute{font-family:Georgia,"Times New Roman",serif;color:var(--cream);cursor:pointer}
#again{position:fixed;left:50%;bottom:calc(38px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:15px;letter-spacing:.12em;background:rgba(5,4,3,.7);border:1px solid var(--gold);border-radius:2px;padding:11px 26px;opacity:0;pointer-events:none;transition:opacity .8s}
#again.show{opacity:1;pointer-events:auto}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:.14em;background:linear-gradient(180deg,rgba(40,30,8,.85),rgba(10,8,3,.9));border:1px solid var(--gold);border-radius:2px;padding:20px 46px;box-shadow:0 0 0 5px rgba(5,4,3,.9),0 0 0 6px rgba(212,175,55,.4),0 0 60px rgba(212,175,55,.3)}
#start small{display:block;font-size:13px;letter-spacing:.08em;color:var(--gold);margin-top:8px;font-style:italic}
#mute{position:fixed;right:30px;top:calc(30px + env(safe-area-inset-top,0px));font-size:16px;line-height:1;background:rgba(5,4,3,.6);border:1px solid var(--gold);border-radius:50%;width:38px;height:38px;display:none}
#from{position:fixed;left:50%;top:calc(50% + 84px);transform:translateX(-50%);font:italic 18px Georgia,"Times New Roman",serif;letter-spacing:.12em;color:var(--gold);white-space:nowrap;text-align:center;text-shadow:0 0 18px rgba(212,175,55,.5)}
#from::before{content:"";display:block;width:56px;height:1px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#again:focus-visible,#start:focus-visible,#mute:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="fx" role="img" aria-label="Animasi ucapan selamat ulang tahun untuk Alfi Masykuroh"></canvas>
<div id="vig"></div><div id="frame"></div>
<button id="again">↻ putar lagi</button>
<button id="mute" aria-label="Matikan suara">🔊</button>
<button id="start">Mulai<small>nyalakan suara</small></button>
<div id="from">from Aunida Comell</div>
<script>
(function(){
  var rain=document.getElementById('rain'),fx=document.getElementById('fx'),again=document.getElementById('again');
  var rc=rain.getContext('2d'),fc=fx.getContext('2d');
  var W,H,dpr,cols,drops,FS=14,P=[],cx,cy,mode='idle',sw=0,run=0,last=0,grad,fw=false,live=false,hl={on:false,p:0,s:1},F=[],S=[],HT=[],HC=['#ff8fb1','#ffd1dc','#f4b6a6','#ffd966','#ff6f91'];
  var cur={gap:4,color:'g',txt:'',pts:[]};
  var CH='HAPPYBIRTHDAYSELAMATULANGTAHUN0123456789';
  var FONT='Georgia,"Times New Roman",serif';
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

  function size(){
    dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;
    [rain,fx].forEach(function(c){c.width=W*dpr;c.height=H*dpr});
    rc.setTransform(dpr,0,0,dpr,0,0);fc.setTransform(dpr,0,0,dpr,0,0);
    grad=fc.createLinearGradient(0,cy-H*.32,0,cy+H*.32);
    grad.addColorStop(0,'#fff1b8');grad.addColorStop(.5,'#d4af37');grad.addColorStop(1,'#9a7414');
    cols=Math.ceil(W/FS);drops=[];
    for(var i=0;i<cols;i++)drops.push(Math.random()*H/FS);
    S=[];for(i=0;i<(reduce?0:70);i++)S.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.2,p:Math.random()*6.28,v:.6+Math.random()*1.4});
  }
  function rainStep(){
    rc.fillStyle='rgba(5,4,3,.14)';rc.fillRect(0,0,W,H);rc.font=FS+'px monospace';
    for(var i=0;i<cols;i++){
      var x=i*FS,y=drops[i]*FS;
      rc.globalAlpha=.32;rc.fillStyle='#b8912f';rc.fillText(CH[Math.random()*CH.length|0],x,y-FS);
      rc.globalAlpha=.7;rc.fillStyle='#fff1b8';rc.fillText(CH[Math.random()*CH.length|0],x,y);
      if(y>H&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  }
  function sample(txt,hm){
    var o=document.createElement('canvas');o.width=W;o.height=H;
    var c=o.getContext('2d'),lines=txt.split('|'),fs=Math.min(H*.42,W*.55);
    while(fs>12){
      c.font='bold '+fs+'px '+FONT;
      var mx=Math.max.apply(null,lines.map(function(l){return c.measureText(l).width}));
      if(mx<=W*(hm?.5:.78)&&lines.length*fs*1.18<=H*(hm?.22:.66))break;
      fs-=3;
    }
    c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
    lines.forEach(function(l,i){c.fillText(l,W/2,H/2+(i-(lines.length-1)/2)*fs*1.18)});
    var d=c.getImageData(0,0,W,H).data,gap=Math.max(2,Math.round(fs/22)),pts;
    do{
      pts=[];
      for(var y=0;y<H;y+=gap)for(var x=0;x<W;x+=gap)if(d[(y*W+x)*4+3]>128)pts.push([x,y]);
      gap++;
    }while(pts.length>5000);
    for(var i=pts.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=pts[i];pts[i]=pts[j];pts[j]=t}
    return {pts:pts,gap:gap-1};
  }
  function assign(txt,color,hm){
    var r=sample(txt,hm);cur.txt=txt;cur.color=color;cur.gap=r.gap;cur.heart=!!hm;hl.on=!!hm;
    if(hm&&r.pts.length){var x0=1e9,x1=-1e9;r.pts.forEach(function(q){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0]});hl.s=Math.min(1.8*(x1-x0)/32,W*.029)}
    while(P.length<r.pts.length)P.push({x:cx,y:cy,vx:0,vy:0,al:0,ta:0,tx:cx,ty:cy,k:.17+Math.random()*.09,a:0,r0:0,s:0});
    P.forEach(function(p,i){
      var q=r.pts[i];
      if(q){p.tx=q[0];p.ty=q[1];p.x=q[0];p.y=q[1];p.ta=1}else p.ta=0;
      p.vx=0;p.vy=0;
    });
  }
  function startSwirl(){
    P.forEach(function(p){
      var dx=p.x-cx,dy=p.y-cy;p.a=Math.atan2(dy,dx);p.r0=Math.hypot(dx,dy);p.s=.1+Math.random()*.1;
    });
    mode='fade';hl.p=0;hl.on=false;P.forEach(function(p){p.ta=0});
  }
  function heart(x,y,s,vx,vy,d){HT.push({x:x,y:y,s:s,vx:vx,vy:vy,d:d,ph:Math.random()*6.28,l:1,c:HC[Math.random()*HC.length|0]})}
  function loveBurst(){if(reduce)return;for(var i=0;i<46;i++){var a=Math.random()*6.283,v=1.5+Math.random()*4;heart(cx,cy,10+Math.random()*16,Math.cos(a)*v,Math.sin(a)*v-1,.006)}}
  function burst(){
    var x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.4),n=reduce?0:46;
    for(var i=0;i<n;i++){var a=i/n*6.283,v=2+Math.random()*3.2;F.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1})}
  }
  function frame(t){
    if(t-last>55){rainStep();last=t}
    fc.clearRect(0,0,W,H);
    var s=cur.gap*.9;fc.fillStyle=cur.color==='g'?grad:cur.color;
    if(mode==='swirl')sw=Math.min(1,sw+16/(reduce?1:140));
    for(var i=0;i<P.length;i++){
      var p=P[i];
      if(mode==='swirl'){
        p.a+=p.s*(1+sw*2.2);
        var rr=p.r0*(1-sw*.93);
        p.x=cx+Math.cos(p.a)*rr;p.y=cy+Math.sin(p.a)*rr*.9;
        p.ta=sw>.15?1:p.ta;
      }else if(mode==='form'){
        p.vx=(p.vx+(p.tx-p.x)*p.k)*.8;p.vy=(p.vy+(p.ty-p.y)*p.k)*.8;
        p.x+=p.vx;p.y+=p.vy;
      }
      p.al+=(p.ta-p.al)*(mode==='fade'?.45:.15);
      if(p.al>.03){fc.globalAlpha=p.al;fc.fillRect(p.x-s/2,p.y-s/2,s,s)}
    }
    fc.fillStyle='#fff1b8';
    for(i=0;i<S.length;i++){
      var q=S[i];q.p+=.03*q.v;var a=Math.max(0,Math.sin(q.p));
      fc.globalAlpha=a*.8;fc.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r);
      fc.fillRect(q.x-q.r*2,q.y-.4,q.r*4,.8);fc.fillRect(q.x-.4,q.y-q.r*2,.8,q.r*4);
    }
    if(fw&&Math.random()<.035)burst();
    fc.fillStyle='#ffd966';
    for(i=F.length-1;i>=0;i--){
      var f=F[i];f.x+=f.vx;f.y+=f.vy;f.vx*=.97;f.vy=f.vy*.97+.05;f.l-=.012;
      if(f.l<=0){F.splice(i,1);continue}
      fc.globalAlpha=f.l;fc.fillRect(f.x-1.2,f.y-1.2,2.4,2.4);
    }
    if(!reduce&&live&&HT.length<45&&Math.random()<.1)heart(Math.random()*W,H+20,9+Math.random()*15,0,-(.6+Math.random()*1.1),.0015);
    if(hl.on){
      hl.p=Math.min(1,hl.p+16/(reduce?1:1500));
      fc.globalAlpha=1;fc.lineCap='round';fc.lineJoin='round';fc.strokeStyle=grad;fc.shadowColor='rgba(212,175,55,.9)';fc.shadowBlur=12;
      [[1,2.6],[.93,1]].forEach(function(L){
        fc.lineWidth=L[1];
        for(var sd=-1;sd<=1;sd+=2){
          fc.beginPath();
          for(var k2=0,n2=Math.round(hl.p*100);k2<=n2;k2++){
            var tt=Math.PI+sd*(k2/100)*Math.PI,hx=16*Math.pow(Math.sin(tt),3),
                hy=13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt),
                px=cx+hx*hl.s*L[0],py=cy-(hy+1)*hl.s*L[0];
            if(k2)fc.lineTo(px,py);else fc.moveTo(px,py);
          }
          fc.stroke();
        }
      });
      fc.shadowBlur=0;
    }
    fc.textAlign='center';fc.textBaseline='middle';
    for(i=HT.length-1;i>=0;i--){
      var h=HT[i];h.ph+=.04;h.x+=h.vx+Math.sin(h.ph)*.6;h.y+=h.vy;h.vx*=.985;h.vy=h.vy*.985-.01;h.l-=h.d;
      if(h.l<=0||h.y<-30){HT.splice(i,1);continue}
      fc.globalAlpha=Math.min(1,h.l*1.4)*.85;fc.fillStyle=h.c;fc.font=h.s+'px '+FONT;fc.fillText('♥',h.x,h.y);
    }
    fc.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  // lagu: Happy Birthday (domain publik), disintesis dengan Web Audio
  var ac=null,master=null,muted=false,BEAT=.4;
  var TUNE=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
            [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
            [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
            [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2.5]];
  function initAudio(){
    if(ac)return;var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    ac=new A();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);
    if(ac.resume)ac.resume();
  }
  function tone(f,t,d,type,v){
    var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  }
  function song(){
    if(!ac)return;var t=ac.currentTime+.05;
    [1,.7].forEach(function(vol,pass){
      TUNE.forEach(function(n,i){
        var end=pass===1&&i===TUNE.length-1,d=end?2.4:Math.max(.5,n[1]*BEAT*1.5);
        tone(n[0],t,d,'triangle',.26*vol);tone(n[0]*2,t,d*.7,'sine',.1*vol);tone(n[0]*3,t,d*.3,'sine',.035*vol);
        if(end)tone(n[0]/2,t,d,'sine',.14);
        t+=n[1]*BEAT;
      });
    });
  }
  function beep(i){if(ac)tone(i===2?1046:784,ac.currentTime,.3,'sine',.22)}
  function chime(){if(!ac)return;var t=ac.currentTime;[1046.5,1318.5,1568,2093].forEach(function(f,k){tone(f,t+k*.16,2,'sine',.16)})}

  var SCENES=[
    ['3','g',800,'b'],['2','g',800,'b'],['1','g',800,'b'],
    ['SELAMAT|ULANG TAHUN|LOVE','g',3400,'hs'],
    ['SEMOGA REZEKIMU|TIDAK SEPERTI|SINYAL DI|AL-HUSNA,|ADA TAPI TIDAK|BISA DIANDALKAN','g',5300],
    ['MAKIN DEWASA|MESKIPUN|KELAKUAN MASIH|VERSI BETA,','g',3000],
    ['DIDEKATKAN|DENGAN SALDO|YANG TIDAK|MENGENAL|KATA LIMIT.','g',3000],
    ['AAMIIN|PALING SERIUS|DARI ORANG|YANG TIDAK|SERIUS.','g',2800],
    ['LOVE|YOU','g',2000],
    ['ALFI|MASYKUROH','g',0,'ch']
  ];
  async function play(){
    var id=++run;again.classList.remove('show');fw=false;live=true;F=[];HT=[];
    if(!P.length)await sleep(300);
    for(var i=0;i<SCENES.length;i++){
      if(id!==run)return;
      var sc=SCENES[i];
      if(P.length){startSwirl();await sleep(reduce?50:140)}
      if(id!==run)return;
      assign(sc[0],sc[1],(sc[3]||'').indexOf('h')>=0);mode='form';
      var fl=sc[3]||'';if(fl==='b')beep(i);if(fl.indexOf('s')>=0)song();if(fl.indexOf('c')>=0){chime();fw=true;burst();loveBurst()}
      if(i===SCENES.length-1)break;
      await sleep(sc[2]);
    }
    await sleep(4400);if(id!==run)return;fw=false;live=false;again.classList.add('show');
  }
  size();
  addEventListener('resize',function(){size();if(cur.txt&&mode==='form')assign(cur.txt,cur.color,cur.heart)});
  again.addEventListener('click',play);
  requestAnimationFrame(frame);
  var st=document.getElementById('start'),mu=document.getElementById('mute');
  st.addEventListener('click',function(){initAudio();st.remove();document.getElementById('from').remove();mu.style.display='block';play()});
  mu.addEventListener('click',function(){
    muted=!muted;if(master)master.gain.value=muted?0:.7;
    mu.textContent=muted?'🔇':'🔊';mu.setAttribute('aria-label',muted?'Nyalakan suara':'Matikan suara');
  });
})();
</script>
</body>
</html>
